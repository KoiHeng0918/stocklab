server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/stocklab?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: YOUR_MYSQL_USER
    password: YOUR_MYSQL_PASSWORD
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

# 实验组：e0 / e0b / e1 / e2 / e3
# 切换策略后必须重启应用：@ConditionalOnProperty 只在启动时生效
benchmark:
  strategy: e1
